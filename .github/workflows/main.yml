name: FB Calendar Auto Update

on:
  schedule:
    # GitHub Actions UTC kullanır. Türkiye saatiyle 03:00 için UTC 00:00 ayarlanır.
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests ics pytz

      - name: Run Script
        run: python update_calendar.py

      - name: Commit and Push
        run: |
          git config --global user.name 'Fenerbahce Bot'
          git config --global user.email 'bot@fenerbahce.com'
          git add fenerbahce.ics
          git commit -m "Skorlar ve Fikstür Güncellendi" || exit 0
          git push origin main --force
