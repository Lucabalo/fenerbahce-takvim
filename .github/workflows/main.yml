name: FB Takvim Guncelleme

on:
  schedule:
    - cron: '0 08,20 * * *' # Türkiye saatiyle sabah ve akşam çalışır
  workflow_dispatch: # İstediğin an elle başlatabilmen için düğme ekler

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerecleri Yukle
        run: pip install -r requirements.txt

      - name: Playwright Tarayicilarini Kur
        run: playwright install chromium --with-deps

      - name: Kütüphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests ics pytz

      - name: Scraperi Calistir
        run: python scraper.py

      - name: Degisiklikleri Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add fenerbahce.ics
          # Değişiklik varsa commit et, yoksa süreci devam ettir
          git commit -m "Takvim guncellendi: $(date)" || echo "Degisiklik yok, devam ediliyor..."
          # Zorunlu push
          git push origin main
