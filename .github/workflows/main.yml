name: FB Calendar Auto Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests ics pytz

      - name: Run Script
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python update_calendar.py

      - name: Commit and Push
        run: |
          git config --global user.name 'Fenerbahce Bot'
          git config --global user.email 'bot@fenerbahce.com'
          git add fenerbahce.ics
          git commit -m "Fikstür ve Skorlar Güncellendi" || exit 0
          git push origin main
