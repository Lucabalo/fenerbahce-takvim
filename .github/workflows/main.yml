name: FB Takvim Guncelleme

on:
  schedule:
    - cron: '0 08,20 * * *' # Türkiye saatiyle sabah ve akşam çalışır
  workflow_dispatch: # İstediğin an elle başlatabilmen için düğme ekler

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerecleri Yukle
        run: pip install -r requirements.txt

      - name: Playwright Tarayicilarini Kur
        run: playwright install chromium --with-deps

      - name: Scraperi Calistir
        run: python scraper.py

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name 'Ahmet-Vibecoder'
          git config --global user.email 'ahmet@example.com'
          git add fenerbahce.ics
          git commit -m "Takvim güncellendi (Skorlar ve yeni maçlar)" || exit 0
          git push
