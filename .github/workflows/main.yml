name: FB Takvim Guncelleme

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yükle
        run: pip install -r requirements.txt

      - name: Script çalıştır
        run: python scraper.py

      - name: Değişiklik varsa commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto update calendar"
      
      - name: Push
        run: git push

      - name: Push
        run: git push

      - name: Push
        run: git push
